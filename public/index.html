<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#071018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/pet.css?v=20261101t">
  <title>鲸鱼娘</title>
</head>
<body>
  <div id="topbar"><time id="clock">--:--</time><div id="top-actions"><button id="config-btn" aria-label="设置">⚙</button><span id="battery" hidden><i class="cell"><i class="fill"></i></i><b>--%</b></span></div></div>
  <div id="bg" aria-hidden="true"></div>
  <div id="glow" aria-hidden="true"></div>
  <div id="stage" aria-hidden="true">
    <video id="pet-a" class="pet" muted playsinline preload="auto" disablepictureinpicture></video>
    <video id="pet-b" class="pet" muted playsinline preload="auto" disablepictureinpicture></video>
  </div>
  <div id="floor" aria-hidden="true"></div>
  <div id="bubble" hidden><span id="bubble-text"></span></div>
  <section id="split-status" hidden>
    <header>
      <span id="ss-state" data-state="idle">连接中</span>
      <div class="ss-title"><span id="ss-session">等待会话…</span></div>
      <button id="ss-switch" hidden>切换</button>
      <span id="ss-live"><i></i>实时</span>
    </header>
    <div class="ss-body">
      <div class="ss-sec"><label>思考</label><p id="ss-think">正在读取本机会话…</p></div>
      <div class="ss-sec" id="ss-exec"><label>执行</label>
        <div id="ss-tool" hidden><span class="name"></span><code></code></div>
        <div id="ss-steps" class="ss-steps" hidden></div>
        <p id="ss-empty">暂无工具调用</p>
      </div>
    </div>
    <footer><span id="ss-meta">—</span><span id="ss-age"></span></footer>
  </section>
  <div id="session-sheet" hidden>
    <header><b>切换会话</b><button id="sheet-close" aria-label="关闭">×</button></header>
    <div id="sheet-list"></div>
  </div>
  <div id="whisper" hidden><span id="whisper-text"></span></div>
  <div id="metrics">
    <div class="m-grid">
      <div class="m-cell"><label>CPU</label><b id="m-cpu">—</b></div>
      <div class="m-cell"><label>内存</label><b id="m-mem">—</b></div>
      <div class="m-cell"><label>推理</label><b id="m-tps">—</b></div>
      <div class="m-cell"><label>用量</label><b id="m-tok">—</b></div>
      <div class="m-cell"><label>余额</label><b id="m-bal">—</b></div>
    </div>
    <div class="m-sub" id="m-sub">等待遥测…</div>
  </div>
  <button id="theme-toggle" hidden aria-label="切换背景模式">☾</button>
  <div id="hint">轻点进入全屏</div>
  <script src="/pet.js?v=20261101t"></script>
</body>
</html>
